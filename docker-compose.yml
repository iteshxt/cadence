# Local infrastructure: `docker compose up -d`
#
# Redis is always needed. Postgres is optional: point DATABASE_URL at your Supabase project, or
# at this container for offline development and tests. Search runs in Postgres (tech-spec §11).
name: cadence

services:
  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    profiles: [localdb]
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports: ['127.0.0.1:5432:5432']
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cadence']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  pg-data:
