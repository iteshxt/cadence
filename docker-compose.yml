# Local infrastructure: `docker compose up -d`
#
# Redis and Elasticsearch are always needed. Postgres is optional: point DATABASE_URL at your
# Supabase project, or at this container for offline development and tests.
name: cadence

services:
  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['127.0.0.1:9200:9200']
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17-alpine
    profiles: [localdb]
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports: ['127.0.0.1:5432:5432']
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cadence']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  es-data:
  pg-data:
